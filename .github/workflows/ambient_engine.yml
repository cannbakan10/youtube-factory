name: "🌧️ Ambient Engine — Rain & Relaxation Videos"

# ╔══════════════════════════════════════════════════════════╗
# ║  AMBIENT ENGINE v1.0                                    ║
# ║                                                         ║
# ║  Produces long ambient videos (1–9 hours)               ║
# ║  Types: rain, fireplace, ocean, thunderstorm, etc.      ║
# ║                                                         ║
# ║  Schedule: Every Sunday at 10:00 UTC                    ║
# ║  Manual: Pick any type + duration on demand             ║
# ╚══════════════════════════════════════════════════════════╝

on:
  schedule:
    - cron: '0 10 * * 0'

  workflow_dispatch:
    inputs:
      ambient_type:
        description: 'Ambient video type'
        required: true
        default: 'rain'
        type: choice
        options:
          - rain
          - cat_fireplace
          - fireplace
          - istanbul_walk
          - rainy_tokyo
          - thunderstorm
          - attic_rain
          - fireplace
          - ocean_sleep
          - coffee_shop
          - moonlit_lake
          - autumn_forest
          - bamboo_forest
          - zen_garden
          - tropical_beach
          - snowy_cabin
      duration_hours:
        description: 'Duration in hours (1-9)'
        required: false
        default: '8'
      upload:
        description: 'Upload to YouTube after render'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  ambient-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      checks: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Determine Parameters
        id: params
        run: |
          TYPE="${{ github.event.inputs.ambient_type }}"
          HOURS="${{ github.event.inputs.duration_hours }}"
          UPLOAD="${{ github.event.inputs.upload }}"
          TYPE=${TYPE:-rain}
          HOURS=${HOURS:-8}
          UPLOAD=${UPLOAD:-true}
          DURATION_MIN=$((HOURS * 60))
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "hours=$HOURS" >> $GITHUB_OUTPUT
          echo "duration_min=$DURATION_MIN" >> $GITHUB_OUTPUT
          echo "upload=$UPLOAD" >> $GITHUB_OUTPUT
          echo "Type: $TYPE | Duration: ${HOURS}h (${DURATION_MIN} min) | Upload: $UPLOAD"

      - name: Produce Ambient Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TYPE="${{ steps.params.outputs.type }}"
          DURATION_MIN="${{ steps.params.outputs.duration_min }}"
          UPLOAD="${{ steps.params.outputs.upload }}"
          UPLOAD_FLAG=""
          if [ "$UPLOAD" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          echo "Producing: $TYPE for ${DURATION_MIN} minutes"
          python main.py --ambient $TYPE --ambient-duration $DURATION_MIN --type long $UPLOAD_FLAG --langs en
