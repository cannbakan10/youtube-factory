name: X (Twitter) Daily Automation

on:
  schedule:
    # Runs at 05:00 UTC (08:00 TR Time) every day
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      topic:
        description: 'Özel bir konu girin (Boş bırakırsanız otomatik seçer)'
        required: false
        default: ''

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run X Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python main.py --x-auto --x-force --x-topic "${{ github.event.inputs.topic }}"
          
      - name: Commit and Push History (Optional)
        run: |
          git config --global user.name "X-Bot"
          git config --global user.email "bot@x.com"
          git add data/*.json
          git commit -m "Update X daily plan and history [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
