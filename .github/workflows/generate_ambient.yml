name: Stream Global Ambient Factory

on:
  workflow_dispatch:
    inputs:
      ambient_type:
        description: 'Ambient Türü'
        required: true
        default: 'sleep'
        type: choice
        options:
        - sleep
        - fireplace
        - rain
        - ocean_sleep
        - brown_noise
        - white_noise
      duration_minutes:
        description: 'Süre (dakika)'
        required: true
        default: '60'
      langs:
        description: 'Dil'
        required: true
        default: 'en'
        type: choice
        options:
        - en
        - tr
      video_type:
        description: 'Video Formatı'
        required: true
        default: 'long'
        type: choice
        options:
        - long
        - shorts
      upload:
        description: 'YouTube yükleme'
        type: boolean
        default: false

jobs:
  generate-ambient:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Credentials
      if: ${{ github.event.inputs.upload == 'true' }}
      run: |
        echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
        echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
      shell: bash

    - name: Run Ambient Factory
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        UPLOAD_FLAG=""
        if [[ "${{ github.event.inputs.upload }}" == "true" ]]; then
          UPLOAD_FLAG="--upload"
        fi

        python main.py \
          --ambient "${{ github.event.inputs.ambient_type }}" \
          --ambient-duration "${{ github.event.inputs.duration_minutes }}" \
          --langs "${{ github.event.inputs.langs }}" \
          --type "${{ github.event.inputs.video_type }}" \
          $UPLOAD_FLAG
