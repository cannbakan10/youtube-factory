name: "🧠 Nightly Brain — Analytics, Cleanup & Planning"

# ╔══════════════════════════════════════════════════════════╗
# ║  NIGHTLY BRAIN v4.0 — Shorts + Ambient Strategy         ║
# ║                                                         ║
# ║  Scheduled: Every night 23:00 UTC (02:00 Turkey)        ║
# ║  Manual: Plan + Produce mode (instant production)       ║
# ║                                                         ║
# ║  0. Reviews last 48h video performance (feedback loop)  ║
# ║  1. Deletes underperformers + mid-length videos (<1h)   ║
# ║  2. Deep US trending scan (chart + search + competitors)║
# ║  3. Ambient video performance analysis (which type?)    ║
# ║  4. Generates Shorts plan + Ambient recommendations     ║
# ║  5. Enriches plan with YouTube SEO keywords             ║
# ║  6. [Manual] Produces Shorts + Ambient immediately      ║
# ╚══════════════════════════════════════════════════════════╝

on:
  schedule:
    - cron: '0 23 * * *'  # Every night 23:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no deletions, plan only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      produce_now:
        description: 'After planning, immediately produce videos'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      shorts_count:
        description: 'How many Shorts to produce immediately'
        required: false
        default: '4'
      ambient_type:
        description: 'Ambient video type (auto = AI recommended)'
        required: false
        default: 'auto'

jobs:
  nightly-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        if: github.event.inputs.produce_now == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Run Nightly Brain (Plan)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🧪 DRY RUN MODE"
            python main.py --nightly-dry
          else
            echo "🧠 LIVE MODE — Cleanup + Trends + Ambient Analysis + Plan"
            python main.py --nightly
          fi

      - name: Commit Plan & Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Nightly Brain Bot"
          git add data/daily_plan.json data/nightly_logs/ -f
          git diff --staged --quiet || git commit -m "🧠 Nightly: cleanup + plan [$(date -u +'%Y-%m-%d')]"
          git pull --rebase origin main || true
          git push origin main

      - name: Produce Shorts Now
        if: github.event.inputs.produce_now == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          SHORTS=${{ github.event.inputs.shorts_count || '4' }}
          echo "📹 INSTANT PRODUCTION: $SHORTS Shorts"
          python main.py --execute-plan --plan-shorts $SHORTS --plan-longform 0

      - name: Produce Ambient Video Now
        if: github.event.inputs.produce_now == 'true'
        env:
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          AMBIENT_TYPE="${{ github.event.inputs.ambient_type || 'auto' }}"

          if [ "$AMBIENT_TYPE" = "auto" ]; then
            # Pick AI-recommended ambient type from plan
            AMBIENT_TYPE=$(python3 -c "
          import json, random
          try:
              plan = json.load(open('data/daily_plan.json'))
              recs = plan.get('ambient_recommendations', [])
              if recs:
                  print(recs[0]['type'])
              else:
                  print(random.choice(['fireplace','rain','ocean','forest','thunderstorm','waterfall','campfire','snow']))
          except:
              print(random.choice(['fireplace','rain','ocean','forest','thunderstorm','waterfall','campfire','snow']))
          ")
          fi

          echo "🔥 INSTANT AMBIENT: 8-hour $AMBIENT_TYPE video"
          python produce_ambient.py --type "$AMBIENT_TYPE" --hours 8 --upload --retry

      - name: Commit Production Results
        if: github.event.inputs.produce_now == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Nightly Brain Bot"
          git add data/daily_plan.json -f
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H:%M')
          git diff --staged --quiet || git commit -m "🎬 Instant production [$TIMESTAMP]"
          git pull --rebase origin main || true
          git push origin main
