name: "🧠 Nightly Brain — Analytics, Cleanup & Planning"

# ╔══════════════════════════════════════════════════════════╗
# ║  NIGHTLY BRAIN v4.1 — Shorts Only (Ambient = Manual)    ║
# ║                                                         ║
# ║  Scheduled: Every night 23:00 UTC (02:00 Turkey)        ║
# ║  Manual: Plan + Produce Shorts immediately              ║
# ║                                                         ║
# ║  0. Reviews last 48h video performance (feedback loop)  ║
# ║  1. Deletes underperformers + mid-length videos (<1h)   ║
# ║  2. Deep US trending scan (chart + search + competitors)║
# ║  3. Ambient video performance analysis                  ║
# ║  4. Generates Shorts plan + Ambient recommendations     ║
# ║  5. Enriches plan with YouTube SEO keywords             ║
# ║  6. [Manual] Produces Shorts immediately                ║
# ╚══════════════════════════════════════════════════════════╝

on:
  # Automated nightly run: 23:00 UTC = 02:00 TR = 18:00 EST
  # (right before US prime-time so the plan is fresh for peak-hour uploads)
  schedule:
    - cron: '0 23 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no deletions, plan only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      produce_now:
        description: 'After planning, immediately produce Shorts'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      shorts_count:
        description: 'How many Shorts to produce immediately'
        required: false
        default: '2'

jobs:
  nightly-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      checks: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        if: github.event.inputs.produce_now == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Run Nightly Brain (Plan)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🧪 DRY RUN MODE"
            python main.py --nightly-dry
          else
            echo "🧠 LIVE MODE — Cleanup + Trends + Ambient Analysis + Plan"
            python main.py --nightly
          fi

      - name: Commit Plan & Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Nightly Brain Bot"
          git add data/daily_plan.json data/nightly_logs/ -f
          git diff --staged --quiet || git commit -m "🧠 Nightly: cleanup + plan [$(date -u +'%Y-%m-%d')]"
          git pull --rebase origin main || true
          git push origin main

      - name: Produce Shorts Now
        if: github.event.inputs.produce_now == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SHORTS=${{ github.event.inputs.shorts_count || '2' }}
          echo "📹 INSTANT PRODUCTION: $SHORTS Shorts"
          python main.py --execute-plan --plan-shorts $SHORTS --plan-longform 0

      - name: Commit Production Results
        if: github.event.inputs.produce_now == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Nightly Brain Bot"
          git add data/daily_plan.json -f
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H:%M')
          git diff --staged --quiet || git commit -m "📹 Instant Shorts production [$TIMESTAMP]"
          git pull --rebase origin main || true
          git push origin main
