name: Stream Global Mega Factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Production mode'
        required: true
        default: 'standard'
        type: choice
        options:
        - standard
        - horror
        - quiz
        - reddit
        - ambient
        - viral
        - viral_remix
        - list_trends
      topic:
        description: 'Topic (for standard/horror mode)'
        required: false
        default: 'trend'
      langs:
        description: 'Language'
        required: true
        default: 'en'
        type: choice
        options:
        - en
      video_type:
        description: 'Video format'
        required: true
        default: 'shorts'
        type: choice
        options:
        - shorts
        - long
      upload:
        description: 'Upload to YouTube'
        type: boolean
        default: false
      list_trends:
        description: 'List trends only (standard/horror mode)'
        type: boolean
        default: false
      bulk:
        description: 'Bulk production (standard/horror mode)'
        type: boolean
        default: false
      category:
        description: 'Category (viral/viral_remix mode)'
        required: false
        default: 'facts'
        type: choice
        options:
        - facts
        - science
        - history
        - psychology
        - nature
        - tech
        - mystery
        - lifestyle
      region:
        description: 'Region (US, GB, etc.)'
        required: false
        default: 'US'
      produce:
        description: 'Produce item number (viral mode, optional)'
        required: false
        default: ''
      ambient_type:
        description: 'Ambient type'
        required: false
        default: 'sleep'
        type: choice
        options:
        - sleep
        - fireplace
        - rain
        - ocean_sleep
        - brown_noise
        - white_noise
      ambient_duration:
        description: 'Ambient duration (minutes)'
        required: false
        default: '60'
      save_remix:
        description: 'Save remix list as JSON'
        type: boolean
        default: true
      produce_remix:
        description: 'Produce remix item number (optional)'
        required: false
        default: ''
      remix_topic:
        description: 'Manual topic override for viral_remix'
        required: false
        default: ''

jobs:
  mega-factory:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Credentials
      if: ${{ github.event.inputs.upload == 'true' }}
      run: |
        echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
        echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
      shell: bash

    - name: Run Mega Factory
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        MODE="${{ github.event.inputs.mode }}"
        CMD=(python main.py)

        case "$MODE" in
          standard)
            if [[ "${{ github.event.inputs.list_trends }}" == "true" ]]; then
              CMD+=(--list-trends)
            else
              CMD+=(--topic "${{ github.event.inputs.topic }}")
              if [[ "${{ github.event.inputs.bulk }}" == "true" ]]; then
                CMD+=(--bulk)
              fi
            fi
            ;;
          horror)
            if [[ "${{ github.event.inputs.list_trends }}" == "true" ]]; then
              CMD+=(--list-trends)
            else
              CMD+=(--topic "${{ github.event.inputs.topic }}" --mode horror)
              if [[ "${{ github.event.inputs.bulk }}" == "true" ]]; then
                CMD+=(--bulk)
              fi
            fi
            ;;
          quiz)
            CMD+=(--topic "${{ github.event.inputs.topic }}" --mode quiz)
            if [[ "${{ github.event.inputs.bulk }}" == "true" ]]; then
              CMD+=(--bulk)
            fi
            ;;
          reddit)
            CMD+=(--topic "${{ github.event.inputs.topic }}" --mode reddit)
            if [[ "${{ github.event.inputs.bulk }}" == "true" ]]; then
              CMD+=(--bulk)
            fi
            ;;
          ambient)
            CMD+=(
              --ambient "${{ github.event.inputs.ambient_type }}"
              --ambient-duration "${{ github.event.inputs.ambient_duration }}"
            )
            ;;
          viral)
            CMD+=(--viral "${{ github.event.inputs.category }}")
            if [[ -n "${{ github.event.inputs.produce }}" ]]; then
              CMD+=(--produce "${{ github.event.inputs.produce }}")
            fi
            ;;
          viral_remix)
            CMD+=(--viral-remix "${{ github.event.inputs.category }}")
            if [[ "${{ github.event.inputs.save_remix }}" == "true" ]]; then
              CMD+=(--save-remix)
            fi
            if [[ -n "${{ github.event.inputs.produce_remix }}" ]]; then
              CMD+=(--produce-remix "${{ github.event.inputs.produce_remix }}")
            fi
            if [[ -n "${{ github.event.inputs.remix_topic }}" ]]; then
              CMD+=(--remix-topic "${{ github.event.inputs.remix_topic }}")
            fi
            ;;
          list_trends)
            CMD+=(--list-trends)
            ;;
          *)
            echo "Unknown mode: $MODE"
            exit 1
            ;;
        esac

        if [[ "$MODE" != "list_trends" ]]; then
          CMD+=(--langs "${{ github.event.inputs.langs }}" --type "${{ github.event.inputs.video_type }}")
        fi
        CMD+=(--region "${{ github.event.inputs.region }}")

        if [[ "${{ github.event.inputs.upload }}" == "true" ]]; then
          CMD+=(--upload)
        fi

        printf 'Running command:'
        printf ' %q' "${CMD[@]}"
        echo
        "${CMD[@]}"
