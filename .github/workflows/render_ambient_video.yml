name: "🎬 Render & Upload Ambient Video"

on:
  workflow_dispatch:
    inputs:
      video_file:
        description: 'Source video filename in assets/stream/'
        required: true
        default: 'cat_landscape.mp4'
      audio_file:
        description: 'Audio filename in assets/stream/'
        required: true
        default: 'fireplace_crackling.mp3'
      duration_hours:
        description: 'Duration in hours'
        required: true
        default: '8'
      title:
        description: 'YouTube video title'
        required: true
        default: 'Cozy Cat by the Fireplace - 8 Hours Crackling Fire Sounds for Sleep'
      description:
        description: 'YouTube video description'
        required: false
        default: 'Watch a cozy cat relax by a warm crackling fireplace for 8 full hours. Perfect for sleep, study and relaxation. #cat #fireplace #sleep #asmr #cozy #8hours'

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Render Video
        run: |
          VIDEO="${{ github.event.inputs.video_file }}"
          AUDIO="${{ github.event.inputs.audio_file }}"
          HOURS="${{ github.event.inputs.duration_hours }}"
          DURATION=$((HOURS * 3600))

          echo "🎬 Rendering ${HOURS}h video: $VIDEO + $AUDIO"

          ffmpeg -y \
            -stream_loop -1 -i "assets/stream/$VIDEO" \
            -stream_loop -1 -i "assets/stream/$AUDIO" \
            -map 0:v:0 -map 1:a:0 \
            -t $DURATION \
            -vf "scale=1280:720" \
            -c:v libx264 -preset ultrafast -b:v 500k \
            -c:a aac -b:a 96k \
            output_final.mp4

          ls -lh output_final.mp4
          echo "✅ Render complete!"

      - name: Upload to YouTube
        env:
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -c "
          import sys
          from src.services.youtube_service import YouTubeService
          yt = YouTubeService()
          vid = yt.upload_video(
              'output_final.mp4',
              '${{ github.event.inputs.title }}',
              '${{ github.event.inputs.description }}',
              ['cozy cat', 'fireplace', 'sleep sounds', 'crackling fire', 'relaxing', '8 hours', 'ambient', 'asmr'],
              video_type='long',
          )
          if vid:
              print(f'SUCCESS: https://youtu.be/{vid}')
          else:
              print('UPLOAD FAILED')
              sys.exit(1)
          "
