name: "🎬 Content Engine — Shorts Production"

# ╔══════════════════════════════════════════════════════════╗
# ║  CONTENT ENGINE v5.0 — Quality Over Quantity             ║
# ║                                                         ║
# ║  Channel Strategy:                                      ║
# ║  • 1 Short per batch, 1 batch/day = ~5 Shorts/week     ║
# ║  • Mon-Fri only (weekends off for algorithm digestion)  ║
# ║  • Posted at US prime time for max initial traction     ║
# ║                                                         ║
# ║  ┌──────────┬──────────────────────────────────────────┐ ║
# ║  │ Time UTC │ Action                                   │ ║
# ║  ├──────────┼──────────────────────────────────────────┤ ║
# ║  │ 20:00    │ 1 Short (US 3-4PM ET prime time)        │ ║
# ║  └──────────┴──────────────────────────────────────────┘ ║
# ║                                                         ║
# ║  Why 1/day: YouTube 2026 algorithm rewards quality over ║
# ║  quantity. 16/day = spam flag + self-cannibalization.   ║
# ║  Each Short needs 2-4h warm-up for algorithm testing.  ║
# ╚══════════════════════════════════════════════════════════╝

on:
  # 1 Short/day, Mon-Fri only, at US prime time (3PM ET = 20:00 UTC)
  schedule:
    - cron: '0 20 * * 1-5'

  workflow_dispatch:
    inputs:
      count:
        description: 'Number of Shorts to produce'
        required: false
        default: '3'

jobs:
  produce-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      checks: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull Latest Plan
        run: git pull origin main

      - name: Check Daily Plan
        id: check_plan
        run: |
          if [ ! -f "data/daily_plan.json" ]; then
            echo "status=no_plan" >> $GITHUB_OUTPUT
            echo "❌ No daily plan found. Nightly Brain must run first."
            exit 0
          fi

          STATUS=$(python3 -c "
          import json
          try:
              d = json.load(open('data/daily_plan.json'))
              plan_status = d.get('status', 'unknown')
              shorts = d.get('shorts', [])
              pending = sum(1 for s in shorts if s.get('status','pending') == 'pending')
              print(f'plan_status={plan_status},pending_shorts={pending}')
          except:
              print('plan_status=error,pending_shorts=0')
          ")

          PENDING=$(echo $STATUS | grep -oP 'pending_shorts=\K[0-9]+' || echo "0")
          PLAN_STATUS=$(echo $STATUS | grep -oP 'plan_status=\K[^,]+' || echo "unknown")

          echo "pending_shorts=$PENDING" >> $GITHUB_OUTPUT

          if [ "$PLAN_STATUS" = "completed" ] || [ "$PENDING" = "0" ]; then
            echo "status=completed" >> $GITHUB_OUTPUT
            echo "⏭️ All Shorts completed or no pending"
          else
            echo "status=ready" >> $GITHUB_OUTPUT
            echo "📋 Plan ready: $PENDING shorts pending"
          fi

      - name: Set up Python
        if: steps.check_plan.outputs.status == 'ready'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Produce Shorts
        if: steps.check_plan.outputs.status == 'ready'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          MANUAL_COUNT="${{ github.event.inputs.count }}"
          COUNT=${MANUAL_COUNT:-1}
          echo "📹 Producing $COUNT Shorts"
          python main.py --execute-plan --plan-shorts $COUNT --plan-longform 0 --langs en

      - name: Commit Progress
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Content Engine Bot"
          git add data/daily_plan.json -f
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H:%M')
          git diff --staged --quiet || git commit -m "📹 Produced Shorts [$TIMESTAMP]"
          git pull --rebase origin main || true
          git push origin main

      - name: Skip — No Plan
        if: steps.check_plan.outputs.status != 'ready'
        run: echo "⏭️ No pending Shorts. Waiting for Nightly Brain."
