name: TikTok Daily Cross-Post

on:
  schedule:
    # Runs 3 times a day: 09:00, 15:00, 21:00 UTC (günde 3 post)
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub
    inputs:
      count:
        description: 'Number of videos to cross-post'
        required: false
        default: '1'

jobs:
  cross-post-to-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TikTok Cross-Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          python main.py --tiktok-auto --tiktok-count $COUNT

      - name: Commit History (avoid duplicate posts)
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/tiktok_history.json || true
          git diff --cached --quiet || git commit -m "📱 Update TikTok history [skip ci]"
          git push || true
