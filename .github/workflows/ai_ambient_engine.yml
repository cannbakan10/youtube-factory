name: "🤖 AI Ambient Engine — DALL-E 3 Cozy Videos"

# ╔══════════════════════════════════════════════════════════╗
# ║  AI AMBIENT ENGINE v1.0                                 ║
# ║                                                         ║
# ║  Produces long AI-generated ambient videos (1–9 hours)  ║
# ║  Visuals: DALL-E 3 + Ken Burns + fire overlay           ║
# ║  Audio:   Cat purring + fire crackling / brown noise    ║
# ║                                                         ║
# ║  Schedule: Every Saturday at 11:00 UTC                  ║
# ║  Manual:   Pick preset + duration on demand             ║
# ╚══════════════════════════════════════════════════════════╝

on:
  schedule:
    - cron: '0 11 * * 6'   # Every Saturday at 11:00 UTC

  workflow_dispatch:
    inputs:
      preset:
        description: 'AI ambient preset'
        required: true
        default: 'cat_fireplace'
        type: choice
        options:
          - cat_fireplace
          - cozy_fireplace
          - rainy_window
      duration_hours:
        description: 'Duration in hours (1-9)'
        required: false
        default: '8'
      upload:
        description: 'Upload to YouTube after render'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  ai-ambient-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      checks: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Determine Parameters
        id: params
        run: |
          PRESET="${{ github.event.inputs.preset }}"
          HOURS="${{ github.event.inputs.duration_hours }}"
          UPLOAD="${{ github.event.inputs.upload }}"
          PRESET=${PRESET:-cat_fireplace}
          HOURS=${HOURS:-8}
          UPLOAD=${UPLOAD:-true}
          DURATION_MIN=$((HOURS * 60))
          echo "preset=$PRESET" >> $GITHUB_OUTPUT
          echo "hours=$HOURS" >> $GITHUB_OUTPUT
          echo "duration_min=$DURATION_MIN" >> $GITHUB_OUTPUT
          echo "upload=$UPLOAD" >> $GITHUB_OUTPUT
          echo "Preset: $PRESET | Duration: ${HOURS}h (${DURATION_MIN} min) | Upload: $UPLOAD"

      - name: Produce AI Ambient Video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          PRESET="${{ steps.params.outputs.preset }}"
          DURATION_MIN="${{ steps.params.outputs.duration_min }}"
          UPLOAD="${{ steps.params.outputs.upload }}"
          UPLOAD_FLAG=""
          if [ "$UPLOAD" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          echo "🤖 AI Ambient: $PRESET for ${DURATION_MIN} minutes"
          python main.py --ai-ambient $PRESET --ai-ambient-duration $DURATION_MIN $UPLOAD_FLAG --langs en
