name: Stream Global Horror Story Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Horror Story Theme (Type "trend" for viral mystery)'
        required: true
        default: 'trend'
      langs:
        description: 'Language'
        required: true
        default: 'en'
        type: choice
        options:
        - en
      list_trends:
        description: 'List trends only'
        type: boolean
        default: false
      video_type:
        description: 'Video format'
        required: true
        default: 'shorts'
        type: choice
        options:
        - shorts
        - long
      upload:
        description: 'Upload to YouTube'
        type: boolean
        default: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Credentials
      if: ${{ github.event.inputs.upload == 'true' }}
      run: |
        echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
        echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
      shell: bash

    - name: Run Horror Factory
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        UPLOAD_FLAG=""
        if [[ "${{ github.event.inputs.upload }}" == "true" ]]; then
          UPLOAD_FLAG="--upload"
        fi

        if [[ "${{ github.event.inputs.list_trends }}" == "true" ]]; then
          python main.py --list-trends
        else
          python main.py --topic "${{ github.event.inputs.topic }}" --langs "${{ github.event.inputs.langs }}" --mode horror --type "${{ github.event.inputs.video_type }}" $UPLOAD_FLAG
        fi
