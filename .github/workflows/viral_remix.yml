name: Stream Global Viral Remix

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Kategori'
        required: true
        default: 'facts'
        type: choice
        options:
        - facts
        - science
        - history
        - psychology
        - nature
        - tech
        - mystery
        - lifestyle
      region:
        description: 'Bölge (US, TR, GB...)'
        required: true
        default: 'US'
      langs:
        description: 'Üretim dilleri'
        required: true
        default: 'en'
        type: choice
        options:
        - en
        - tr
        - en,tr
      video_type:
        description: 'Video Formatı'
        required: true
        default: 'shorts'
        type: choice
        options:
        - shorts
        - long
      save_remix:
        description: 'Remix listesini JSON kaydet'
        type: boolean
        default: true
      produce_remix:
        description: 'Listeden üretilecek sıra (boşsa sadece listeler)'
        required: false
        default: ''
      remix_topic:
        description: 'Opsiyonel manuel topic override'
        required: false
        default: ''
      upload:
        description: 'YouTube yükleme (produce_remix ile)'
        type: boolean
        default: false

jobs:
  viral-remix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Credentials
      if: ${{ github.event.inputs.upload == 'true' }}
      run: |
        echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
        echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
      shell: bash

    - name: Run Viral Remix
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        CMD=(
          python main.py
          --viral-remix "${{ github.event.inputs.category }}"
          --region "${{ github.event.inputs.region }}"
          --langs "${{ github.event.inputs.langs }}"
          --type "${{ github.event.inputs.video_type }}"
        )

        if [[ "${{ github.event.inputs.save_remix }}" == "true" ]]; then
          CMD+=(--save-remix)
        fi

        if [[ -n "${{ github.event.inputs.produce_remix }}" ]]; then
          CMD+=(--produce-remix "${{ github.event.inputs.produce_remix }}")
        fi

        if [[ -n "${{ github.event.inputs.remix_topic }}" ]]; then
          CMD+=(--remix-topic "${{ github.event.inputs.remix_topic }}")
        fi

        if [[ "${{ github.event.inputs.upload }}" == "true" ]]; then
          CMD+=(--upload)
        fi

        printf 'Running command:'
        printf ' %q' "${CMD[@]}"
        echo
        "${CMD[@]}"
