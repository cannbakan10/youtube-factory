name: Nature Shorts Daily Automation

on:
  schedule:
    # Runs 3 times a day: 08:00, 14:00, 20:00 UTC
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub
    inputs:
      category:
        description: 'Category (rain, ocean, forest, thunderstorm, etc. or random)'
        required: false
        default: 'random'
      count:
        description: 'Number of shorts to create'
        required: false
        default: '2'

jobs:
  create-nature-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore History
        continue-on-error: true
        run: |
          mkdir -p data
          # History file will be committed back to avoid video repeats

      - name: Run Nature Shorts Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json

          # Decode token.pickle if available
          if [ -n "$TOKEN_PICKLE_BASE64" ]; then
            echo "$TOKEN_PICKLE_BASE64" | base64 --decode > token.pickle
          fi

          CATEGORY="${{ github.event.inputs.category || 'random' }}"
          COUNT="${{ github.event.inputs.count || '2' }}"

          if [ "$CATEGORY" = "random" ]; then
            python main.py --nature-shorts-auto --nature-shorts-count $COUNT --upload
          else
            python main.py --nature-shorts $CATEGORY --upload
          fi

      - name: Commit History (avoid duplicate videos)
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/nature_shorts_history.json || true
          git diff --cached --quiet || git commit -m "🌿 Update nature shorts history [skip ci]"
          git push || true
