name: "🎬 Longform Engine — World News Documentaries"

# ╔══════════════════════════════════════════════════════════╗
# ║  LONGFORM ENGINE v1.0 — Daily News Documentaries         ║
# ║                                                         ║
# ║  Produces 10-20 minute deep-dive documentary videos     ║
# ║  about trending world events, geopolitics, and current  ║
# ║  affairs. Content plan comes from Nightly Brain.        ║
# ║                                                         ║
# ║  Schedule: Twice daily (morning + afternoon US time)    ║
# ║  • 14:00 UTC = 10 AM ET — morning production           ║
# ║  • 20:00 UTC = 4 PM ET  — afternoon production         ║
# ║                                                         ║
# ║  Each run produces 1 long-form video (~30-45 min build) ║
# ║  2 runs × 1 video = 2 documentaries/day                ║
# ╚══════════════════════════════════════════════════════════╝

on:
  schedule:
    - cron: '0 14,20 * * *'

  workflow_dispatch:
    inputs:
      count:
        description: 'Number of long-form videos to produce'
        required: false
        default: '1'

jobs:
  produce-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      checks: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull Latest Plan
        run: git pull origin main

      - name: Check Daily Plan
        id: check_plan
        run: |
          if [ ! -f "data/daily_plan.json" ]; then
            echo "status=no_plan" >> $GITHUB_OUTPUT
            echo "❌ No daily plan found. Nightly Brain must run first."
            exit 0
          fi

          STATUS=$(python3 -c "
          import json
          try:
              d = json.load(open('data/daily_plan.json'))
              longform = d.get('longform', [])
              pending = sum(1 for l in longform if l.get('status','pending') in ('pending','failed','error'))
              print(f'pending_longform={pending}')
          except:
              print('pending_longform=0')
          ")

          PENDING=$(echo $STATUS | grep -oP 'pending_longform=\K[0-9]+' || echo "0")
          echo "pending_longform=$PENDING" >> $GITHUB_OUTPUT

          if [ "$PENDING" = "0" ]; then
            echo "status=completed" >> $GITHUB_OUTPUT
            echo "⏭️ All long-form videos completed or none planned"
          else
            echo "status=ready" >> $GITHUB_OUTPUT
            echo "📋 Plan ready: $PENDING long-form videos pending"
          fi

      - name: Set up Python
        if: steps.check_plan.outputs.status == 'ready'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          fi

      - name: Produce Long-form Videos
        if: steps.check_plan.outputs.status == 'ready'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          MANUAL_COUNT="${{ github.event.inputs.count }}"
          COUNT=${MANUAL_COUNT:-1}
          echo "🎬 Producing $COUNT long-form documentary videos"
          python main.py --execute-plan --plan-shorts 0 --plan-longform $COUNT --langs en

      - name: Commit Progress
        if: steps.check_plan.outputs.status == 'ready'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Longform Engine Bot"
          git add data/daily_plan.json -f
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H:%M')
          git diff --staged --quiet || git commit -m "🎬 Produced Longform [$TIMESTAMP]"
          git pull --rebase origin main || true
          git push origin main

      - name: Skip — No Plan
        if: steps.check_plan.outputs.status != 'ready'
        run: echo "⏭️ No pending long-form videos. Waiting for Nightly Brain."
