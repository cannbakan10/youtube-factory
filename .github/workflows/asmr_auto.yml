name: ASMR Shorts Daily Automation

on:
  schedule:
    # Runs at 06:00, 10:00, 14:00, 18:00, 22:00 UTC (one short each run)
    # = 09:00, 13:00, 17:00, 21:00, 01:00 TR time
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many ASMR shorts to produce (default: 1 per trigger)'
        required: false
        default: '1'

jobs:
  produce-asmr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore YouTube Token
        run: |
          if [ -n "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then
            echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
            echo "YouTube token restored."
          fi

      - name: Run ASMR Automation
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          GITHUB_ACTIONS: "true"
        run: |
          COUNT=${{ github.event.inputs.count || '1' }}
          python main.py --asmr-auto --asmr-count $COUNT

      - name: Commit and Push History
        run: |
          git config --global user.name "ASMR-Bot"
          git config --global user.email "bot@asmr.com"
          git add data/*.json
          git commit -m "Update ASMR history [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
