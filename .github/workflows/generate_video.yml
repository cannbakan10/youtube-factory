name: Stream Global Video Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Konusu (Type "trend" for auto-discovery)'
        required: true
        default: 'trend'
      langs:
        description: 'Diller'
        required: true
        default: 'tr'
        type: choice
        options:
        - tr
        - en
        - en,tr
      list_trends:
        description: 'Sadece trendleri listele'
        type: boolean
        default: false
      bulk:
        description: 'BULK MOD (Sadece Trendler için)'
        type: boolean
        default: false
      video_type:
        description: 'Video Formatı'
        required: true
        default: 'shorts'
        type: choice
        options:
        - shorts
        - long
      mode:
        description: 'İçerik Modu (Standart İçerikler)'
        required: true
        default: 'info'
        type: choice
        options:
        - info
        - horror
      workflow_mode:
        description: 'Workflow Modu'
        required: true
        default: 'standard'
        type: choice
        options:
        - standard
        - ambient
        - viral
        - viral_remix
      ambient_type:
        description: 'Ambient Türü (Sadece Ambient Modu)'
        required: false
        default: 'fireplace'
        type: choice
        options:
        - fireplace
        - sleep
        - rain
        - ocean_sleep
        - white_noise
        - brown_noise
        - cozy_library
        - space_ambience
        - cyberpunk_city
        - forest_walk
      ambient_duration:
        description: 'Ambient Süresi (Dakika)'
        required: false
        default: '60'
      viral_category:
        description: 'Viral Kategori (Sadece Viral/Remix Modu)'
        required: false
        default: 'facts'
        type: choice
        options:
        - facts
        - science
        - history
        - psychology
        - nature
        - tech
        - mystery
        - lifestyle
      upload:
        description: 'YouTube yükleme'
        type: boolean
        default: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Credentials
      if: ${{ fromJSON(github.event.inputs.upload) }}
      run: |
        echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
        echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
      shell: bash

    - name: Run Factory
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        BULK_FLAG=""
        UPLOAD_FLAG=""
        if [[ "${{ github.event.inputs.bulk }}" == "true" ]]; then
          BULK_FLAG="--bulk"
        fi
        if [[ "${{ github.event.inputs.upload }}" == "true" ]]; then
          UPLOAD_FLAG="--upload"
        fi

        if [[ "${{ github.event.inputs.workflow_mode }}" == "ambient" ]]; then
          echo "🎧 STARTING AMBIENT PRODUCTION: ${{ github.event.inputs.ambient_type }} (${{ github.event.inputs.ambient_duration }} min)"
          python main.py --ambient "${{ github.event.inputs.ambient_type }}" --ambient-duration "${{ github.event.inputs.ambient_duration }}" --type "${{ github.event.inputs.video_type }}" $UPLOAD_FLAG
        elif [[ "${{ github.event.inputs.workflow_mode }}" == "viral" ]]; then
          echo "🔥 STARTING VIRAL ANALYSIS & AUTO-PRODUCTION: ${{ github.event.inputs.viral_category }}"
          python main.py --viral "${{ github.event.inputs.viral_category }}" --langs "${{ github.event.inputs.langs }}" --type "${{ github.event.inputs.video_type }}" $UPLOAD_FLAG
        elif [[ "${{ github.event.inputs.workflow_mode }}" == "viral_remix" ]]; then
          echo "🧪 STARTING VIRAL REMIX & AUTO-PRODUCTION: ${{ github.event.inputs.viral_category }}"
          python main.py --viral-remix "${{ github.event.inputs.viral_category }}" --langs "${{ github.event.inputs.langs }}" --type "${{ github.event.inputs.video_type }}" $UPLOAD_FLAG
        elif [[ "${{ github.event.inputs.list_trends }}" == "true" ]]; then
          python main.py --list-trends
        else
          echo "🚀 STARTING STANDARD PRODUCTION: ${{ github.event.inputs.topic }} (Mode: ${{ github.event.inputs.mode }})"
          python main.py --topic "${{ github.event.inputs.topic }}" --langs "${{ github.event.inputs.langs }}" --type "${{ github.event.inputs.video_type }}" --mode "${{ github.event.inputs.mode }}" $UPLOAD_FLAG $BULK_FLAG
        fi
