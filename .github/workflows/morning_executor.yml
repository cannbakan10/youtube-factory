name: Morning Content Executor

on:
  schedule:
    # Runs at optimal posting times based on analytics:
    # 08:00 UTC - Morning batch (first shorts)
    # 14:00 UTC - Afternoon batch (more shorts)
    # 20:00 UTC - Evening batch (prime time shorts)
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      shorts_count:
        description: 'Number of shorts to produce'
        required: false
        default: '1'
      longform_count:
        description: 'Number of longform videos to produce'
        required: false
        default: '0'

jobs:
  execute-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Get latest plan from nightly brain
          ref: main

      - name: Pull Latest Changes
        run: git pull origin main

      - name: Check Plan Exists
        id: check_plan
        run: |
          if [ -f "data/daily_plan.json" ]; then
            echo "plan_exists=true" >> $GITHUB_OUTPUT
            STATUS=$(python3 -c "import json; d=json.load(open('data/daily_plan.json')); print(d.get('status','unknown'))")
            echo "plan_status=$STATUS" >> $GITHUB_OUTPUT
            echo "📋 Plan found, status: $STATUS"
          else
            echo "plan_exists=false" >> $GITHUB_OUTPUT
            echo "❌ No plan found"
          fi

      - name: Set up Python
        if: steps.check_plan.outputs.plan_exists == 'true' && steps.check_plan.outputs.plan_status == 'pending'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ffmpeg
        if: steps.check_plan.outputs.plan_exists == 'true' && steps.check_plan.outputs.plan_status == 'pending'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        if: steps.check_plan.outputs.plan_exists == 'true' && steps.check_plan.outputs.plan_status == 'pending'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Content Plan
        if: steps.check_plan.outputs.plan_exists == 'true' && steps.check_plan.outputs.plan_status == 'pending'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
          SHORTS=${{ github.event.inputs.shorts_count || '1' }}
          LONGFORM=${{ github.event.inputs.longform_count || '0' }}
          python main.py --execute-plan --plan-shorts $SHORTS --plan-longform $LONGFORM

      - name: Commit Results
        if: steps.check_plan.outputs.plan_exists == 'true' && steps.check_plan.outputs.plan_status == 'pending'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Content Executor Bot"
          git add data/daily_plan.json -f
          git diff --staged --quiet || git commit -m "🎬 Plan executed [$(date -u +%Y-%m-%d %H:%M)]"
          git push

      - name: Skip - No Plan
        if: steps.check_plan.outputs.plan_exists != 'true' || steps.check_plan.outputs.plan_status != 'pending'
        run: |
          echo "⏭️ Skipping: No pending plan to execute"
          echo "Plan exists: ${{ steps.check_plan.outputs.plan_exists }}"
          echo "Plan status: ${{ steps.check_plan.outputs.plan_status }}"
